# Runs the whole app: web on http://localhost:3000, API on http://localhost:4000.
#   cp server/.env.example server/.env   # set OPENAI_API_KEY
#   docker compose up -d --build
services:
  server:
    build: ./server
    restart: unless-stopped
    # time to hang up running calls before the container is stopped
    stop_grace_period: 15s
    env_file: ./server/.env
    environment:
      PORT: '3000'
      STORAGE_DIR: /app/storage
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    volumes:
      - storage:/app/storage
    ports:
      - '127.0.0.1:4000:3000'

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  storage:
